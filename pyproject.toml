[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetify-cf"
version = "0.1.0"
description = "Counterfactual recommendation microservice for Diabetify"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.11.4",
  "pika==1.3.2",
  "python-dotenv==1.0.1",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==20.0.0",
  "scikit-learn==1.6.1",
  "xgboost-cpu==3.0.1",
]

[project.optional-dependencies]
dice = [
  "dice-ml==0.12",
]
experiments = [
  "dice-ml==0.12",
]
dev = [
  "black>=24.0.0,<25.0.0",
  "mypy>=1.8.0,<2.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
exclude = "tests/"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
